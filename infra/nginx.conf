worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # No URL query strings, IPs, cookies or request bodies in this log format.
  log_format privacy '$request_method $status $request_time';
  access_log /var/log/nginx/access.log privacy;
  error_log /var/log/nginx/error.log crit;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  limit_req_zone $binary_remote_addr zone=enquiries:10m rate=6r/m;
  upstream nice_app { server app:3000; keepalive 32; }
  server {
    listen 8080;
    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    location = /api/enquiries {
      limit_req zone=enquiries burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://nice_app;
      proxy_buffering off;
      add_header Cache-Control 'no-store' always;
    }
    location /api/ { proxy_pass http://nice_app; proxy_buffering off; }
    location / { proxy_pass http://nice_app; }
  }
}
