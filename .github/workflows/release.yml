name: Build and promote container
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      site_url:
        description: HTTPS canonical origin for this release
        required: true
      indexable:
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select immutable image tag
        id: image
        shell: bash
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tag }}
          sbom: true
          provenance: mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ inputs.site_url }}
            NEXT_PUBLIC_INDEXABLE=${{ inputs.indexable }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
      - name: Deploy immutable image through approved host webhook
        if: ${{ vars.DEPLOYMENT_ENABLED == 'true' }}
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DEPLOY_URL" && test -n "$DEPLOY_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.request
          data = json.dumps({'image': os.environ['IMAGE'], 'digest': os.environ['DIGEST']}).encode()
          request = urllib.request.Request(os.environ['DEPLOY_URL'], data=data, headers={'Authorization': 'Bearer '+os.environ['DEPLOY_TOKEN'], 'Content-Type':'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              assert 200 <= response.status < 300
          PY
      - name: Record image for promotion or rollback
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Image %s\nDigest %s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
